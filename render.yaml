# Render Blueprint Specification for VigilNet Deployment
services:
  - type: web
    name: vigilnet-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 10000
      - key: NEO4J_URI
        sync: false # User will input this on Render Dashboard
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false # User will input this on Render Dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: vigilnet-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # User will input this on Render Dashboard
      - key: SARVAM_API_KEY
        sync: false # User will input this on Render Dashboard

databases:
  - name: vigilnet-db
    plan: free
